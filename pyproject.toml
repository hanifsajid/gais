[project]
name = "gais"
version = "0.1.1"
description = "A unified and consistent interface for working with multiple LLM providers."
authors = [
    {name = "Hanif Sajid",email = "hanifwrites@gmail.com"}
]
readme = "README.md"
license = {text = 'MIT'}
keywords = ["llm", "openai", "ollama", "grok", "anthropic", "deepseek", "local", "gemini", "parallel", "batch", "text generation", "parsed outputs"]
requires-python = ">=3.11"
dependencies = [
    "openai (>=2.8.1,<3.0.0)"
]

[project.urls]
Homepage = "https://hanifsajid.github.io/gais"
Repository = "https://github.com/hanifsajid/gais"
doucmentation = "https://hanifsajid.github.io/gais"


[tool.poetry]
packages = [{include = "gais", from = "src"}]


[tool.poetry.group.dev.dependencies]
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
ghp-import = "^2.1.0"


[tool.poetry.group.test.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
